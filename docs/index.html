<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>一級建築士 学科 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E8EBE5; --sheet:#FBFCFA; --ink:#1D211C; --ink2:#4F564E; --ink3:#7C8379;
  --rule:#CFD4CC; --soft:#E4E8E1; --wash:#F1F3EF;
  --ok:#3E8A57; --warn:#A87F27; --bad:#CB5566;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#111310; --sheet:#1A1D19; --ink:#ECEFE9; --ink2:#B5BBB2; --ink3:#878D84;
    --rule:#353B33; --soft:#272B25; --wash:#20241F; --ok:#6DB585; --warn:#D1A94F; --bad:#E07F8D}
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  font-size:15px;line-height:1.6;padding:12px 12px 48px}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.n{font-feature-settings:"tnum" 1,"lnum" 1}
.sp{flex:1}

.app{max-width:720px;margin:0 auto;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.pane{background:var(--sheet);border:1px solid var(--rule);border-radius:3px;overflow:hidden}
.empty{padding:40px 16px;text-align:center;color:var(--ink2)}

/* 科目の印 */
.mk{display:inline-grid;place-items:center;width:18px;height:18px;flex:0 0 18px;color:#fff;font-style:normal;
  font-size:11px;font-weight:700;line-height:1}
.mk.lg{width:36px;height:36px;flex-basis:36px;font-size:18px}
.mk.plain{background:var(--ink);color:var(--sheet)}

/* 見出し */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding:4px 4px 0}
.top h1{font-size:19px;font-weight:700;line-height:1.35}
.top p{font-size:12px;color:var(--ink2)}
.count{text-align:right;line-height:1.1;white-space:nowrap}
.count b{font-size:32px;font-weight:700}
.count span{font-size:13px;margin-left:2px}
.count small{display:block;font-size:11px;color:var(--ink3);margin-top:4px}

/* 今週のカード */
.card{border-color:var(--ink)}
.wnav{display:flex;align-items:center;border-bottom:1px solid var(--soft)}
.wnav > button{width:48px;height:56px;background:none;border:0;font-size:24px;color:var(--ink2)}
.wnav > button:disabled{opacity:.25;cursor:default}
.wnow{flex:1;text-align:center;line-height:1.35}
.wnow b{font-size:17px;margin:0 6px;vertical-align:middle}
.wnow small{display:block;font-size:11.5px;color:var(--ink3)}
.wtoday{display:block;width:100%;background:var(--wash);border:0;border-bottom:1px solid var(--soft);
  padding:8px;font-size:12px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-block;font-size:11px;line-height:1.5;padding:1px 8px;border:1px solid var(--rule);border-radius:99px;
  color:var(--ink2);white-space:nowrap;vertical-align:middle}
.chip.solid{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chip.ok{color:var(--ok);border-color:currentColor}
.chip.warn{color:var(--warn);border-color:currentColor}
.whead{display:flex;gap:12px;padding:16px 16px 8px;align-items:flex-start}
.mks{display:flex;flex-direction:column;gap:3px}
.whead h2{font-size:19px;line-height:1.4;font-weight:700}
.whead h2 .plus{color:var(--ink3);font-weight:400;margin:0 5px}
.whead p{font-size:12px;color:var(--ink2);margin-top:3px}
.tracks{padding:0 8px}
.tracks .none{padding:12px 8px 16px;font-size:13px;color:var(--ink2)}
.trk{display:flex;gap:12px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--soft);
  padding:13px 8px;min-height:56px;align-items:flex-start}
.box{flex:0 0 24px;height:24px;border:2px solid var(--ink3);border-radius:3px;margin-top:1px;position:relative}
.trk.on .box{background:var(--ink);border-color:var(--ink)}
.trk.on .box::after{content:"";position:absolute;left:7px;top:2px;width:6px;height:12px;
  border:solid var(--sheet);border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
.tb{flex:1;min-width:0;display:grid;gap:4px}
.tg{font-size:11px;letter-spacing:.08em;color:var(--ink3)}
.tu{display:flex;flex-wrap:wrap;align-items:center;gap:2px 7px;font-size:14.5px}
.tu b{font-weight:500}
.tu small{flex:1 1 100%;font-size:11.5px;color:var(--ink2)}
.trk.on .tu b{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--rule)}
.trk.on .tu small{color:var(--ink3)}

.hours{margin:0 16px;padding:14px 0 16px;border-top:1px solid var(--soft)}
.hl{display:flex;align-items:baseline;gap:6px;font-size:12px;color:var(--ink2)}
.hl b{font-size:20px;color:var(--ink);margin-left:auto}
.bar{height:6px;background:var(--soft);margin:8px 0 12px}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .2s}
.step{display:flex;gap:8px}
.step button{flex:1;min-height:42px;border:1px solid var(--rule);background:var(--sheet);border-radius:3px;font-size:13px}
.step button:active{background:var(--wash)}

.save{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--wash);
  border-top:1px solid var(--soft);font-size:12px;color:var(--ink2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink3);flex:0 0 8px}
.dot.ok{background:var(--ok)}.dot.busy,.dot.warn{background:var(--warn)}.dot.err{background:var(--bad)}
.mini{font-size:12px;padding:6px 12px;min-height:32px;border:1px solid var(--ink);background:transparent;border-radius:3px;
  text-decoration:none;color:var(--ink);display:inline-flex;align-items:center}
.mini.g{border-color:var(--rule);color:var(--ink2)}
.linkbox{padding:12px 16px;border-top:1px solid var(--soft)}
.linkbox h3{font-size:11px;font-weight:500;letter-spacing:.08em;color:var(--ink3);margin-bottom:4px}
.linkbox p{font-size:12.5px;color:var(--ink2);line-height:1.65}
.linkbox p + p{margin-top:4px}
details > summary{list-style:none;cursor:pointer;padding:12px 16px;font-size:12.5px;color:var(--ink2);
  display:flex;align-items:center;gap:8px}
details > summary::-webkit-details-marker{display:none}
details > summary::before{content:"▸";font-size:11px}
details[open] > summary::before{content:"▾"}
.steps{border-top:1px solid var(--soft)}
.steps ol{padding:0 16px 14px 38px;font-size:13px;color:var(--ink2)}
.steps li{padding:2px 0}

/* 全体 */
.over{padding:14px 16px 12px}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;color:var(--ink2);flex-wrap:wrap}
.ph b{font-size:20px;color:var(--ink)}
.meters{display:grid}
.meter{display:grid;grid-template-columns:18px 2.4em minmax(0,1fr) 2.4em;gap:8px;align-items:center;
  background:none;border:0;padding:7px 0;text-align:left}
.meter .mn{font-size:13px;font-weight:500}
.meter .mc{font-size:12px;color:var(--ink3);text-align:right}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:10px;background:var(--soft)}
.segs i.on{background:var(--c)}
.segs i.cur{box-shadow:inset 0 0 0 2px var(--c)}
.rb{display:flex;gap:1px;margin-top:16px;padding-top:8px}
.rb button{flex:1 1 0;min-width:0;height:34px;border:0;padding:0;opacity:.22;position:relative}
.rb .part{opacity:.6}
.rb .done{opacity:1}
.rb .now{opacity:1;outline:2px solid var(--ink);outline-offset:1px;z-index:1}
.rb .slip{outline:1px dashed var(--bad);outline-offset:1px}
.rb .gate::before{content:"";position:absolute;left:50%;top:-8px;width:5px;height:5px;margin-left:-2.5px;
  background:var(--ink);transform:rotate(45deg)}
.rb .sel::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:3px;background:var(--ink)}
.ax{position:relative;height:16px;margin-top:9px;font-size:10px;color:var(--ink3)}
.ax span{position:absolute;top:0;white-space:nowrap}

/* 予定 */
.tabs{display:flex}
.tabs button{flex:1;padding:12px;background:none;border:0;font-size:13px;color:var(--ink3)}
.tabs button.on{color:var(--ink);font-weight:700;box-shadow:inset 0 -2px 0 var(--ink)}
.gh{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;background:var(--wash);
  font-size:13px;border-top:1px solid var(--rule)}
.gh b{display:inline-flex;align-items:center;gap:7px}
.gh span{font-size:11.5px;color:var(--ink3)}
.gl{padding:0 16px 10px;background:var(--wash);font-size:12px;color:var(--ink2)}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;
  border-top:1px solid var(--soft);padding:10px 16px;min-height:50px}
.row.static{cursor:default}
.row.sel{background:var(--wash)}
.row.cur{box-shadow:inset 3px 0 0 var(--ink)}
.rw{flex:0 0 auto;min-width:50px;line-height:1.25}
.rw b{font-size:13px;display:block;font-weight:700}
.rw small{font-size:11px;color:var(--ink3)}
.rm{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:2px 14px;font-size:13.5px}
.ru{display:inline-flex;align-items:center;gap:6px}
.ru em{font-style:normal;color:var(--ink2);font-size:12px}
.rc{flex:1 1 100%;font-size:11px;color:var(--ink3)}
.rs{flex:0 0 auto;font-size:12px;color:var(--ink3)}
.row.done .rm{opacity:.55}
.row.done .rs{color:var(--ok);font-weight:700}

/* 設定 */
.setb{padding:4px 16px 16px;display:grid;gap:14px}
.setb p{font-size:12.5px;color:var(--ink2)}
.btns,.fields{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fields input{flex:1 1 180px;min-width:0;font-size:14px;padding:9px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--sheet)}
.cst{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink2)}
.warn{font-size:12px;color:var(--ink2);border-left:2px solid var(--rule);padding-left:10px}
.foot{padding:4px;display:flex;flex-wrap:wrap;gap:2px 16px;font-size:11px;color:var(--ink3)}

@media (min-width:1000px){
  body{padding:28px 24px 56px}
  .app{max-width:1120px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .top,.set,.foot{grid-column:1/-1}
  .card{grid-column:1;grid-row:2 / span 2;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
  .over,.plan{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script src="state.js"></script>
<script>
/* state.json を毎回キャッシュ無効で取り直す。取れなければ同梱の state.js にフォールバック。 */
(async function(){
  let S = window.STATE;
  try{
    const res = await fetch("state.json?t=" + Date.now(), {cache:"no-store"});
    if(res.ok) S = await res.json();
  }catch(e){ /* file:// / オフライン */ }
  if(!S){
    document.getElementById("app").innerHTML =
      '<p class="empty">計画データがまだありません。<br>python3 scripts/build.py を実行するか、Actions の sync を待ってください。</p>';
    return;
  }
  boot(S);
})();

function boot(S){
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,"0");
const md=iso=>{const p=String(iso).split("-");return (+p[1])+"/"+(+p[2])};
const arr=x=>Array.isArray(x)?x:(x?[x]:[]);

const W=S.weeks, NW=W.length, CUR=S.current, SUB=S.subjects, ROT=S.rotation;
/* 旧形式の state（単元が1つだけ）でも動くようにそろえる */
W.forEach(r=>{
  r.new=arr(r.new); r.review=arr(r.review); r.exam=arr(r.exam); r.tracks=r.tracks||[];
  r.tracks.forEach(t=>{ t.units=t.units||arr(t.unit); });
  r.hours=+r.hours||0;
});
const PRIOR=arr(S.prior);
const wk=w=>W.find(x=>x.w===w);
const key=u=>u.subject+u.unit;
const mark=(s,cls)=>`<i class="mk ${cls||""}" style="background:${SUB[s].color}">${SUB[s].ch}</i>`;
const newDone=r=>r.tracks.some(t=>t.key==="new"&&t.done);

/* 単元 → いつ学ぶか */
const UNIT={};
PRIOR.forEach(u=>{ UNIT[key(u)]={u,prior:true}; });
W.forEach(r=>r.new.forEach(u=>{ UNIT[key(u)]={u,w:r.w}; }));
const isDone=e=>!!e&&(e.prior||newDone(wk(e.w)));
const unitsOf=s=>Object.values(UNIT).filter(e=>e.u.subject===s).sort((a,b)=>a.u.unit-b.u.unit);
const TOTAL=Object.keys(UNIT).length;
const priorText=()=>ROT.map(s=>{
  const n=PRIOR.filter(u=>u.subject===s).map(u=>u.unit);
  return n.length?`${s} ${n[0]}${n.length>1?"〜"+n[n.length-1]:""}`:"";
}).filter(Boolean).join(" ／ ");

let selected=CUR, view="week", dirty=false;
const days=Math.max(0,Math.ceil((new Date(S.meta.exam_date+"T00:00:00")-Date.now())/864e5));

$("app").innerHTML=`
<header class="top">
  <div><h1>${esc(S.meta.title)}</h1><p>いま W${pad(CUR)} ／ 残り ${S.summary.weeks_left} 週</p></div>
  <div class="count"><b class="n">${days}</b><span>日</span><small>本試験 ${md(S.meta.exam_date)} まで</small></div>
</header>

<section class="pane card" id="card">
  <div class="wnav">
    <button id="wPrev" aria-label="前の週">‹</button>
    <div class="wnow"><span class="chip" id="kLab"></span><b class="n" id="kWk"></b><small id="kDt"></small></div>
    <button id="wNext" aria-label="次の週">›</button>
  </div>
  <button class="wtoday" id="wToday" hidden>今週（W${pad(CUR)}）へ戻る</button>
  <div class="whead" id="wHead"></div>
  <div class="tracks" id="tracks"></div>
  <div class="hours" id="hoursBox">
    <div class="hl"><span>今週の学習時間</span><span id="hProg"></span><b class="n" id="hHours">0</b><span>/ <span class="n" id="hBudget">0</span> h</span></div>
    <div class="bar"><i id="hBar"></i></div>
    <div class="step">
      <button id="hMinus">−30分</button><button id="hPlus">＋30分</button><button id="hPlus2">＋1時間</button>
    </div>
  </div>
  <div class="save">
    <span class="dot" id="sDot"></span><span id="sMsg"></span><span class="sp"></span>
    <button class="mini g" id="sSetup">同期を設定</button>
    <button class="mini" id="hCopy">記録をコピー</button>
    <a class="mini g" id="hIssue" hidden target="_blank" rel="noopener">Issue を開く</a>
  </div>
  <div class="linkbox" id="linkbox" hidden><h3>ほかの科目とのつながり</h3><div id="linkList"></div></div>
  <details class="steps"><summary>進めかたの目安</summary><ol id="hSteps"></ol></details>
</section>

<section class="pane over">
  <div class="ph"><span id="pUnits"></span><span class="chip" id="pPace"></span><span class="sp"></span>
    <span>残り <span class="n">${S.summary.hours_left}</span> h</span></div>
  <div class="meters" id="meters"></div>
  <div class="rb" id="rb"></div>
  <div class="ax" id="ax"></div>
</section>

<section class="pane plan">
  <div class="tabs"><button data-v="week" class="on">週順</button><button data-v="subject">科目別</button></div>
  <div id="list"></div>
</section>

<details class="pane set" id="set"><summary>同期と書き出し</summary>
  <div class="setb">
    <p>チェックと学習時間を全端末でそろえるには、このリポジトリ専用のトークンを入れて接続します。入れない場合は「記録をコピー」か週次 Issue を使ってください。</p>
    <div class="fields">
      <input id="cRepo" placeholder="owner/repo" autocomplete="off" spellcheck="false" aria-label="リポジトリ">
      <input id="cTok" type="password" placeholder="github_pat_..." autocomplete="off" spellcheck="false" aria-label="トークン">
      <button class="mini" id="cSave">接続</button>
      <button class="mini g" id="cClear">切断</button>
    </div>
    <div class="cst"><span class="dot" id="cDot"></span><span id="cSt"></span></div>
    <p class="warn">Fine-grained PAT を、このリポジトリだけ・Contents の Read and write だけで発行してください。トークンはこの端末のブラウザに保存されます。GitHub Pages は同じアカウントの全サイトで保存領域を共有するため、権限は最小に、有効期限は短めに。</p>
    <div class="btns">
      <a class="mini" href="plan.ics" download>カレンダー（plan.ics）を書き出す</a>
      <a class="mini g" href="state.json" target="_blank" rel="noopener">state.json</a>
    </div>
  </div>
</details>

<footer class="foot">
  <span>全${NW}週 ／ ${TOTAL}単元 ／ 計 ${S.summary.hours_total}h</span>
  <span>本試験 ${esc(S.meta.exam_date)} ※2027年1月の公告で要確認</span>
  <span>データ ${esc(S.generated)} ／ 表示 ${new Date().toLocaleString("ja-JP",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}</span>
</footer>`;

/* ── 全体の進み ─────────────────────────────────── */
function paintPace(){
  const all=Object.values(UNIT), done=all.filter(isDone).length;
  const due=all.filter(e=>e.prior||e.w<CUR).length, lag=due-done;
  $("pUnits").innerHTML=`<b class="n">${done}</b> / ${TOTAL} 単元`;
  const c=$("pPace");
  c.textContent=lag>0?`${lag}単元 遅れ`:(lag<0?`${-lag}単元 先行`:"予定どおり");
  c.className="chip "+(lag>0?"warn":"ok");
  $("meters").innerHTML=ROT.map(s=>{
    const us=unitsOf(s), d=us.filter(isDone).length;
    return `<button class="meter" data-s="${esc(s)}" aria-label="${esc(s)} ${d}/${us.length}">${mark(s)}<span class="mn">${esc(s)}</span>`
      +`<span class="segs">${us.map(e=>`<i class="${isDone(e)?"on":(e.w===CUR?"cur":"")}" style="--c:${SUB[s].color}"></i>`).join("")}</span>`
      +`<span class="mc n">${d}/${us.length}</span></button>`;
  }).join("");
  $("meters").querySelectorAll(".meter").forEach(b=>{
    b.onclick=()=>{ setView("subject"); const g=$("g-"+b.dataset.s); if(g) g.scrollIntoView({behavior:"smooth",block:"start"}); };
  });
}

/* ── 51週の帯 ───────────────────────────────────── */
const frac=r=>r.type==="prior"?1:(r.tracks.length?r.tracks.filter(t=>t.done).length/r.tracks.length:0);
function bg(r){
  if(r.new.length===1) return SUB[r.new[0].subject].color;
  if(r.new.length>1) return "linear-gradient(180deg,"+r.new.map((u,i,a)=>
    `${SUB[u.subject].color} ${i*100/a.length}% ${(i+1)*100/a.length}%`).join(",")+")";
  if(r.final_subject) return SUB[r.final_subject].color;
  if(r.type==="prior"&&PRIOR[0]) return SUB[PRIOR[0].subject].color;
  return "var(--ink)";
}
const wtitle=r=>"W"+pad(r.w)+" "+(r.new.length?r.new.map(u=>key(u)+" "+u.short).join(" ＋ ")
  :(r.final_subject?r.final_subject+" 総まとめ":r.phase));
const rb=$("rb");
W.forEach(r=>{
  const b=document.createElement("button");
  b.style.background=bg(r); b.title=wtitle(r); b.setAttribute("aria-label",b.title);
  b.onclick=()=>sel(r.w);
  rb.appendChild(b);
});
function paintRibbon(){
  [...rb.children].forEach((b,i)=>{
    const r=W[i], f=frac(r);
    b.className=(r.status==="slipped"?"slip ":"")+(f===1?"done ":(f>0?"part ":""))
      +(r.w===CUR?"now ":"")+(r.w===selected?"sel ":"")+(r.type==="midterm"?"gate":"");
  });
}
(function(){ let last=-1;
  $("ax").innerHTML=W.map(r=>{ const m=+r.start.split("-")[1]; if(m===last) return ""; last=m;
    return `<span style="left:${(r.w-1)/NW*100}%">${m}月</span>`; }).join("");
})();

/* ── 選んだ週 ───────────────────────────────────── */
const GLYPH={midterm:"試",buffer:"予",prior:"済",bridge:"替",final:"直"};
function paintWeek(){
  const r=wk(selected), w=r.w;
  $("kLab").textContent=w===CUR?"今週":(w<CUR?"過去":"予定");
  $("kLab").className="chip"+(w===CUR?" solid":"");
  $("kWk").textContent="W"+pad(w);
  $("kDt").textContent=md(r.start)+" – "+md(r.end)+"　"+r.phase+(r.round?"　第"+r.round+"ローテ":"");
  $("wPrev").disabled=w<=1; $("wNext").disabled=w>=NW; $("wToday").hidden=w===CUR;

  let h;
  if(r.new.length){
    h=`<div class="mks">${r.new.map(u=>mark(u.subject,"lg")).join("")}</div><div>`
      +`<h2>${r.new.map(u=>`${esc(u.subject)}${u.unit} ${esc(u.short)}`).join('<span class="plus">＋</span>')}</h2>`
      +`<p>${esc(r.new.flatMap(u=>u.chapters).join(" ／ "))}</p></div>`;
  }else if(r.final_subject){
    h=`<div class="mks">${mark(r.final_subject,"lg")}</div><div><h2>${esc(r.final_subject)} 総まとめ</h2>`
      +`<p>${esc((r.final_extra||[]).join(" ／ ")||"全8単元の速習 → 年度別")}</p></div>`;
  }else{
    const ms=S.milestones.filter(m=>m.week===w).map(m=>m.note).join(" ／ ");
    const sub=r.type==="prior"?"先行して学習済み： "+priorText():(ms||"");
    h=`<div class="mks"><i class="mk lg plain">${GLYPH[r.type]||"週"}</i></div><div><h2>${esc(r.phase)}</h2><p>${esc(sub)}</p></div>`;
  }
  $("wHead").innerHTML=h;

  const host=$("tracks"); host.innerHTML="";
  if(!r.tracks.length) host.innerHTML='<p class="none">この週にチェックする項目はありません。</p>';
  r.tracks.forEach(tk=>{
    const b=document.createElement("button");
    b.className="trk"+(tk.done?" on":"");
    b.setAttribute("aria-pressed",tk.done?"true":"false");
    b.innerHTML=`<span class="box"></span><span class="tb"><span class="tg">${esc(tk.label)}</span>`
      +(tk.units.length
        ? tk.units.map(u=>`<span class="tu">${mark(u.subject)}<b>${esc(u.subject)}${u.unit} ${esc(u.short)}</b><small>${esc(u.chapters.join(" ／ "))}</small></span>`).join("")
        : `<span class="tu"><b>${esc(tk.note||tk.label)}</b></span>`)
      +`</span>`;
    b.onclick=()=>{ tk.done=!tk.done; changed(); };
    host.appendChild(b);
  });

  const dn=r.tracks.filter(t=>t.done).length;
  $("hoursBox").hidden=r.type==="prior";
  $("hProg").textContent=r.tracks.length?`（${dn}/${r.tracks.length} 完了）`:"";
  $("hHours").textContent=r.hours;
  $("hBudget").textContent=r.budget;
  $("hBar").style.width=Math.min(100,r.budget?r.hours/r.budget*100:0)+"%";
  $("hSteps").innerHTML=(r.task_list||[]).map(x=>`<li>${esc(x)}</li>`).join("");

  const links=r.links||[];
  $("linkbox").hidden=!links.length;
  $("linkList").innerHTML=links.map(x=>`<p>${esc(x)}</p>`).join("");

  const iss=$("hIssue");
  if(S.meta.repo){
    iss.hidden=false;
    iss.href=`https://github.com/${S.meta.repo}/issues?q=`+encodeURIComponent(`W${pad(w)} in:title`);
  }
}

/* ── 予定の一覧 ─────────────────────────────────── */
function weekRow(r){
  const f=frac(r), b=document.createElement("button");
  b.className="row"+(r.w===CUR?" cur":"")+(r.w===selected?" sel":"")+(f===1?" done":"");
  b.innerHTML=`<span class="rw n"><b>W${pad(r.w)}</b><small>${md(r.start)}</small></span><span class="rm">`
    +(r.new.length
      ? r.new.map(u=>`<span class="ru">${mark(u.subject)}${esc(u.subject)}${u.unit} <em>${esc(u.short)}</em></span>`).join("")
      : `<span class="ru">${r.final_subject?mark(r.final_subject)+esc(r.final_subject)+" 総まとめ":esc(r.phase)}</span>`)
    +`</span><span class="rs n">${f===1?"✓":(r.tracks.length?r.tracks.filter(t=>t.done).length+"/"+r.tracks.length:"")}</span>`;
  b.onclick=()=>sel(r.w,true);
  return b;
}
function paintList(){
  const host=$("list"); host.innerHTML="";
  if(view==="week"){
    let i=0;
    while(i<NW){
      const r=W[i]; let j=i;
      if(r.type==="prior"){
        while(j<NW&&W[j].type==="prior") j++;
        const b=document.createElement("button");
        b.className="row done"+(selected>=r.w&&selected<=W[j-1].w?" sel":"");
        b.innerHTML=`<span class="rw n"><b>W${pad(r.w)}–${pad(W[j-1].w)}</b><small>${md(r.start)}</small></span>`
          +`<span class="rm"><span class="ru">${esc(r.phase)}　${esc(priorText())}</span></span><span class="rs">✓</span>`;
        b.onclick=()=>sel(r.w,true);
        host.appendChild(b); i=j; continue;
      }
      if(r.round){
        while(j<NW&&W[j].round===r.round) j++;
        const g=document.createElement("div");
        g.innerHTML=`<div class="gh"><b>第${r.round}ローテ</b><span class="n">W${pad(r.w)}–${pad(W[j-1].w)}　${md(r.start)} – ${md(W[j-1].end)}</span></div>`
          +((r.links||[]).length?`<div class="gl">${r.links.map(x=>`<p>${esc(x)}</p>`).join("")}</div>`:"");
        for(let k=i;k<j;k++) g.appendChild(weekRow(W[k]));
        host.appendChild(g); i=j; continue;
      }
      host.appendChild(weekRow(r)); i++;
    }
  }else{
    ROT.forEach(s=>{
      const us=unitsOf(s), fin=W.find(r=>r.final_subject===s);
      const g=document.createElement("div"); g.id="g-"+s;
      g.innerHTML=`<div class="gh"><b>${mark(s)}${esc(s)}</b><span class="n">${us.filter(isDone).length}/${us.length} 済　${SUB[s].questions}問`
        +(fin?`　総まとめ W${pad(fin.w)}`:"")+`</span></div>`;
      us.forEach(e=>{
        const done=isDone(e), b=document.createElement("button");
        b.className="row"+(done?" done":"")+(e.prior?" static":"")+(!e.prior&&e.w===selected?" sel":"")+(!e.prior&&e.w===CUR?" cur":"");
        b.innerHTML=`<span class="rw n"><b>${e.prior?"済":"W"+pad(e.w)}</b><small>${e.prior?"先行":md(wk(e.w).start)}</small></span>`
          +`<span class="rm"><span class="ru">${esc(s)}${e.u.unit} <em>${esc(e.u.short)}</em></span><small class="rc">${esc(e.u.chapters.join(" ／ "))}</small></span>`
          +`<span class="rs">${done?"✓":""}</span>`;
        if(!e.prior) b.onclick=()=>sel(e.w,true);
        g.appendChild(b);
      });
      host.appendChild(g);
    });
  }
}
function setView(v){
  view=v;
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  paintList();
}
document.querySelectorAll(".tabs button").forEach(b=>{ b.onclick=()=>setView(b.dataset.v); });

function paintAll(){ paintPace(); paintWeek(); paintRibbon(); paintList(); }
function sel(w,scroll){
  selected=Math.min(NW,Math.max(1,w));
  paintWeek(); paintRibbon(); paintList();
  if(scroll) $("card").scrollIntoView({behavior:"smooth",block:"start"});
}
$("wPrev").onclick=()=>sel(selected-1);
$("wNext").onclick=()=>sel(selected+1);
$("wToday").onclick=()=>sel(CUR);

function changed(){
  dirty=true; paintAll();
  if(connected()) schedulePush(); else setSave();
}
function addHours(d){
  const r=wk(selected);
  r.hours=Math.max(0,Math.round((r.hours+d)*2)/2);
  changed();
}
$("hMinus").onclick=()=>addHours(-0.5);
$("hPlus").onclick=()=>addHours(0.5);
$("hPlus2").onclick=()=>addHours(1);

$("hCopy").onclick=()=>{
  const r=wk(selected), L=[`W${pad(r.w)}:`];
  r.tracks.forEach(tk=>L.push(`  ${tk.key}: ${tk.done}`));
  if(r.hours) L.push(`  hours: ${r.hours}`);
  const txt=L.join("\n");
  (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject())
    .then(()=>setSave("コピーしました。data/log.yaml に貼ってください","ok"))
    .catch(()=>window.prompt("data/log.yaml に貼ってください",txt));
};
$("sSetup").onclick=()=>{ const d=$("set"); d.open=true; d.scrollIntoView({behavior:"smooth",block:"start"}); $("cRepo").focus(); };

/* ══ 端末間の同期（GitHub Contents API） ══════════════
   data/log.yaml を直接読み書きします。サーバは要りません。 */
const LOGPATH="data/log.yaml";
const LS={ get(k){try{return localStorage.getItem(k)}catch(e){return null}},
           set(k,v){try{localStorage.setItem(k,v)}catch(e){}},
           del(k){try{localStorage.removeItem(k)}catch(e){}} };
let CONN={repo:LS.get("kk_repo")||S.meta.repo||"", tok:LS.get("kk_tok")||""};
function connected(){ return !!(CONN.repo&&CONN.tok); }

function setSave(msg,cls){
  if(msg==null){
    if(connected()){ msg="チェックは自動で保存されます"; cls="ok"; }
    else if(dirty){ msg="未保存：この端末だけの状態です"; cls="warn"; }
    else { msg="未接続：チェックはこの端末だけに残ります"; cls=""; }
  }
  $("sMsg").textContent=msg; $("sDot").className="dot "+(cls||"");
  $("sSetup").hidden=connected();
}
function st(msg,cls){ $("cSt").textContent=msg; $("cDot").className="dot "+(cls||""); }

const b64=s=>btoa(String.fromCharCode.apply(null,new TextEncoder().encode(s)));
const unb64=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)));

function parseLog(txt){
  const out={}; let cur=null;
  txt.split(/\r?\n/).forEach(l=>{
    if(!l.trim()||/^\s*#/.test(l)) return;
    let m=l.match(/^(W\d+):\s*$/);
    if(m){ cur=out[m[1]]={}; return; }
    m=l.match(/^\s+([A-Za-z_]+):\s*(.*)$/);
    if(m&&cur){ const v=m[2].trim();
      cur[m[1]] = v==="true"?true : v==="false"?false
                : (v!=="" && !isNaN(+v) ? +v : v.replace(/^["']|["']$/g,"")); }
  });
  return out;
}
const LOGHEAD = "# 記録。トラックを true にすると完了です。\n"
              + "# new / review / exam / cum / test / final / years\n"
              + "# 遅れたときだけ status: slipped と moved_to: を書きます。\n"
              + "# このファイルは UI からも書き換わります。\n\n";
function dumpLog(log){
  const num=k=>parseInt(k.replace(/\D/g,""),10)||0;
  return LOGHEAD + Object.keys(log).sort((a,b)=>num(a)-num(b)).map(k=>{
    const v=log[k]||{};
    const body=Object.keys(v).filter(f=>v[f]!==null&&v[f]!=="")
      .map(f=>`  ${f}: ${v[f]}`).join("\n");
    return k+":\n"+body;
  }).join("\n\n")+"\n";
}

function api(path,opt){
  return fetch(`https://api.github.com/repos/${CONN.repo}/contents/${path}`,
    Object.assign({headers:{Authorization:"Bearer "+CONN.tok,
      Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}},opt||{}));
}

function applyLog(log){
  W.forEach(r=>{
    const e=log["W"+pad(r.w)]; if(!e) return;
    r.tracks.forEach(tk=>{ if(e[tk.key]!==undefined) tk.done=!!e[tk.key]; });
    r.hours=+e.hours||0;
    if(e.status) r.status=e.status;
  });
  paintAll();
}

let pushTimer=null, pushing=false;
async function pull(){
  if(!connected()) return;
  st("読み込み中…","busy");
  try{
    const r=await api(LOGPATH+"?t="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error(r.status===404?"log.yaml が見つかりません"
      :(r.status===401||r.status===403?"トークンが無効か、権限が足りません":"GitHub "+r.status));
    const j=await r.json();
    applyLog(parseLog(unb64(j.content)));
    dirty=false; st("接続済み："+CONN.repo,"ok"); setSave();
  }catch(e){ st("接続できません："+e.message,"err"); setSave("読み込めません："+e.message,"err"); }
}
function schedulePush(){
  clearTimeout(pushTimer);
  setSave("保存待ち…","busy");
  pushTimer=setTimeout(push,900);
}
async function push(retry){
  pushTimer=null;
  if(pushing&&!retry){ pushTimer=setTimeout(push,900); return; }
  pushing=true; setSave("保存中…","busy");
  try{
    const cur=await api(LOGPATH+"?t="+Date.now(),{cache:"no-store"});
    if(!cur.ok&&cur.status!==404) throw new Error("GitHub "+cur.status);
    const j=cur.ok?await cur.json():null;
    const log=j?parseLog(unb64(j.content)):{};
    W.forEach(r=>{
      if(!r.tracks.length) return;
      const k="W"+pad(r.w);
      if(!r.tracks.some(t=>t.done)&&!r.hours&&!log[k]) return;
      const e=log[k]||{};
      r.tracks.forEach(t=>{ e[t.key]=t.done; });
      if(r.hours) e.hours=r.hours; else delete e.hours;
      log[k]=e;
    });
    const res=await api(LOGPATH,{method:"PUT",body:JSON.stringify({
      message:"chore: 進捗を更新", content:b64(dumpLog(log)), sha:j?j.sha:undefined })});
    if(res.status===409&&!retry) return push(true);
    if(!res.ok) throw new Error("GitHub "+res.status);
    dirty=false; st("接続済み："+CONN.repo,"ok");
    setSave("保存しました "+new Date().toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"}),"ok");
  }catch(e){
    setSave("保存できません（"+e.message+"）。記録をコピーして log.yaml へ","err");
  }
  pushing=false;
}

$("cRepo").value=CONN.repo;
$("cTok").value=CONN.tok?"••••••••":"";
$("cSave").onclick=()=>{
  const rp=$("cRepo").value.trim(), tk=$("cTok").value.trim();
  if(rp){ CONN.repo=rp; LS.set("kk_repo",rp); }
  if(tk&&!/^•+$/.test(tk)){ CONN.tok=tk; LS.set("kk_tok",tk); $("cTok").value="••••••••"; }
  if(connected()) pull(); else st("owner/repo とトークンの両方を入れてください","warn");
};
$("cClear").onclick=()=>{
  CONN={repo:S.meta.repo||"",tok:""};
  LS.del("kk_tok"); LS.del("kk_repo");
  $("cTok").value="";
  st("未接続",""); setSave();
};
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden&&connected()&&!pushing&&!pushTimer&&!dirty) pull();
});

paintAll();
st(connected()?"読み込み中…":"未接続","");
setSave();
if(connected()) pull();
}
</script>
