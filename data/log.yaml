# ─────────────────────────────────────────────────────────
#  記録。ここだけを更新すれば進捗が反映されます。
#
#  トラック（その週にやること）を true にすると完了です。
#    new    新規     今週の単元 + 該当範囲の過去問
#    review 復習     先週のノートとキーワード
#    exam   過去問   先々週範囲を時間計測で
#    cum    累積     既習範囲から20問
#    test   模試     中間テストの週のみ
#    final / years   直前期の週のみ
#
#  status を書かなければ、トラックの状態から自動で決まります。
#  遅れたときだけ status: slipped と moved_to: を手で書きます。
# ─────────────────────────────────────────────────────────

W01:
  new: false

# ── 記入例 ──────────────────────────────────────────
#
# W04:
#   new: true
#   review: true
#   exam: true
#   cum: true
#   hours: 15
#   exam_note: { set: R05-構造, score: "22/30" }
#
# W12:
#   status: slipped
#   moved_to: 16
#   memo: 出張で潰れた
