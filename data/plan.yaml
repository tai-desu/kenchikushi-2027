# ─────────────────────────────────────────────────────────
#  一級建築士 学科 2027  学習計画マスタ
#  このファイルが唯一の原本。ここを直せば全部が追随します。
# ─────────────────────────────────────────────────────────

meta:
  title: 一級建築士 学科 2027
  start_date: 2026-08-03      # W01 の月曜
  exam_date: 2027-07-25       # ※2027年1月の公告で要確認
  total_weeks: 51
  # 週次 Issue へのリンクを出したい場合だけ owner/repo を書く（例: yourname/kenchikushi-2027）
  repo: null

# ローテーション順（この順序は変えないこと）
rotation: [計画, 環境, 法規, 構造, 施工]

# 3トラック + 累積。lag = 何週前の単元を扱うか
tracks:
  new:    { lag: 0, ratio: 0.60, label: 新規 }
  review: { lag: 1, ratio: 0.10, label: 復習 }
  exam:   { lag: 2, ratio: 0.20, label: 過去問 }
  cum:    { lag: null, ratio: 0.10, label: 累積, mode: spaced }

# 出題数と時間配分の重み
subjects:
  計画: { ch: 計, color: "#CB5566", iro: 今様, questions: 20, weight: 0.85 }
  環境: { ch: 環, color: "#7C8480", iro: 銀鼠, questions: 20, weight: 0.90 }
  法規: { ch: 法, color: "#A87F27", iro: 黄土, questions: 30, weight: 1.25 }
  構造: { ch: 構, color: "#2E6BA8", iro: 縹,   questions: 30, weight: 1.25 }
  施工: { ch: 施, color: "#3E8A57", iro: 常磐, questions: 25, weight: 1.05 }

phases:
  - { weeks: [1, 20],  name: 基礎期,      units: [1, 4], hours: 13 }
  - { weeks: [21, 21], name: 中間テスト①, type: midterm, questions: 62,  hours: 12 }
  - { weeks: [22, 22], name: 予備週,      type: buffer,  hours: 10 }
  - { weeks: [23, 42], name: 演習期,      units: [5, 8], hours: 15 }
  - { weeks: [43, 43], name: 中間テスト②, type: midterm, questions: 125, hours: 15 }
  - { weeks: [44, 51], name: 直前期,      type: final,   hours: 20 }

milestones:
  - { week: 21, name: 中間テスト①, note: "各科目 単元1〜4 ／ 62問・3.5h" }
  - { week: 22, name: 法令集セットアップ, note: "2027年版を購入し線引き" }
  - { week: 43, name: 中間テスト②, note: "全範囲 125問 ／ 本番と同じ時間割" }
  - { week: 51, name: 本試験, note: "2027-07-25（日）" }

# ─────────────────────────────────────────────────────────
#  単元 → 教材の章
#  ★重要★ 単元番号 = ローテーション番号。
#  同じ番号の単元は同じ5週間の中で学習されるので、
#  科目をまたいで関連する章を同じ番号に置いてあります。
#  章番号順ではありません。並べ替えるときは連結が壊れないか確認。
# ─────────────────────────────────────────────────────────
units:
  計画:
    1: { short: 基本計画,   chapters: ["1章 建築基本計画"] }
    2: { short: 計画一般,   chapters: ["6章 建築計画一般"] }
    3: { short: 公共,       chapters: ["3章 公共建築計画"] }
    4: { short: 都市計画,   chapters: ["9章 都市計画"] }
    5: { short: 住宅,       chapters: ["2章 住宅建築計画"] }
    6: { short: 商業,       chapters: ["4章 商業建築計画"] }
    7: { short: 建築史,     chapters: ["10章 建築史"] }
    8: { short: 積算生産,   chapters: ["7章 建築積算", "8章 建築生産"] }
  環境:
    1: { short: 環境伝熱,   chapters: ["1章 環境", "3章 伝熱・結露"] }
    2: { short: 換気採光,   chapters: ["2章 換気", "5章 採光"] }
    3: { short: 色彩音響,   chapters: ["6章 色彩", "7章 音響"] }
    4: { short: 日照日射,   chapters: ["4章 日照・日影・日射"] }
    5: { short: 環境融合,   chapters: ["8章 環境工学融合"] }
    6: { short: 空調,       chapters: ["9章 空気調和設備"] }
    7: { short: 照明防災,   chapters: ["12章 照明設備", "13章 消火・防災設備"] }
    8: { short: 給排水電気, chapters: ["10章 給排水設備", "11章 電気・搬送設備"] }
  法規:
    1: { short: 総則,       chapters: ["1章 総則"] }
    2: { short: 一般構造,   chapters: ["2章 一般構造"] }
    3: { short: 集団①,     chapters: ["6章 都市計画区域等の制限 ①（用途地域・容積率・建蔽率・道路）"] }
    4: { short: 集団②,     chapters: ["6章 都市計画区域等の制限 ②（高さ制限・日影規制）", "7章 建築協定，雑則等"] }
    5: { short: 構造強度,   chapters: ["3章 構造強度"] }
    6: { short: 防火,       chapters: ["4章 防火規定"] }
    7: { short: 避難設備,   chapters: ["5章 避難規定，建築設備"] }
    8: { short: 士法法令,   chapters: ["8章 建築司法", "9章 その他の関係法令"] }
  構造:
    1: { short: 力・静定,   chapters: ["1章 力のつり合い", "2章 静定構造の応力"] }
    2: { short: 断面応力,   chapters: ["3章 断面性質", "4章 応力度・座屈・変形"] }
    3: { short: 不静定振動, chapters: ["5章 不静定構造の反力", "6章 振動・構造物の崩壊", "14章 制振構造・免震構造"] }
    4: { short: 地盤基礎,   chapters: ["15章 地盤・基礎構造"] }
    5: { short: 一次設計,   chapters: ["7章 一次設計", "8章 構造計画・構造計算"] }
    6: { short: RC壁式,     chapters: ["11章 RC構造", "12章 壁式・プレストレストコンクリート構造"] }
    7: { short: S合成,      chapters: ["10章 S構造", "13章 合成構造"] }
    8: { short: 木造,       chapters: ["9章 木造構造"] }
  施工:
    1: { short: 業務計画,   chapters: ["1章 施工業務", "2章 施工計画"] }
    2: { short: 管理仮設,   chapters: ["3章 施工管理", "4章 仮設工事"] }
    3: { short: 仕上げ,     chapters: ["13章 仕上げ工事"] }
    4: { short: 地盤土工,   chapters: ["5章 地盤調査", "6章 土工事・山留工事", "7章 基礎・地業工事"] }
    5: { short: 鉄筋型枠,   chapters: ["8章 鉄筋工事", "9章 型枠工事"] }
    6: { short: コンPCa,    chapters: ["10章 コンクリート工事", "11章 プレキャストRC工事"] }
    7: { short: 鉄骨,       chapters: ["12章 鉄骨工事"] }
    8: { short: 改修設備,   chapters: ["14章 改修工事", "15章 設備工事"] }

# 科目をまたぐ結合。UIに表示し、ノートの相互リンクを促す
links:
  2: ["環境の採光・換気 ↔ 法規2章の 1/7・1/20 規定 ↔ 計画の各部寸法"]
  3: ["環境の音響・色彩 ↔ 計画の劇場・ホール ↔ 施工の内装仕上げ"]
  4: ["環境の日影 ↔ 法規の日影規制 ↔ 計画の都市計画", "構造の地盤・基礎 ↔ 施工の地盤調査・山留・杭"]
  5: ["法規3章 構造強度（計算ルート）↔ 構造の一次設計・構造計画"]
  6: ["構造のRC ↔ 施工のコンクリート・PCa（前週の鉄筋・型枠とも重なる）"]
  7: ["構造のS造 ↔ 施工の鉄骨", "環境の消火・防災設備 ↔ 法規5章 建築設備"]
  8: ["計画の建築生産 ↔ 法規の建築士法・建設業法", "環境の給排水・電気 ↔ 施工の設備工事", "法規の耐震改修促進法 ↔ 施工の改修工事"]

# 直前期（W44〜W48）の科目別総まとめ。融合章はここで回収する
final_review:
  44: { subject: 計画, extra: ["5章 公共・商業建築計画融合"] }
  45: { subject: 環境, extra: ["14章 環境・設備融合"] }
  46: { subject: 法規, extra: [] }
  47: { subject: 構造, extra: [] }
  48: { subject: 施工, extra: [] }

# 週のタスク雛形
task_template:
  default:
    - テキスト通読
    - ノートに自分の言葉で書き起こす
    - 図・式を手で描き起こす
    - 該当範囲の過去問を解く
    - 誤答をノートに追記
    - 先週ノートの再読（REVIEW）
    - 先々週範囲の過去問を時間計測（EXAM）
  midterm:
    - 模試を本番の時間割で実施
    - 科目別得点を記録
    - 誤答を4分類（知識/読解/計算/ケアレス）
    - 弱点単元を次週の累積に登録
    - 復習を完了
  final:
    - 全単元を見出しだけで説明できるか確認
    - 年度別を時間計測で1本
    - 誤答を当日中に潰す
    - 法令集の索引を確認（法規週のみ）
    - 弱点ノートを更新
